<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy (Phase A, exact from task brief).
      - Everything is served from `'self'` (the bundled dist/ assets loaded by
        WebView2 via a local origin / file://). No CDN.
      - style-src allows the small `'unsafe-inline'` needed by Tabulator's
        runtime cell styles; script-src is strict `'self'` only.
      - connect-src 'none': the grid never makes network calls. All data
        arrives via window.chrome.webview postMessage from the .NET host.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>VibeTable</title>
  </head>
  <body>
    <!--
      Grid mount point. Task 8 only renders a read-only Tabulator grid here;
      the full table-picker / paging flow arrives in Task 10. When no table
      has been selected yet we show a small status line.
    -->
    <div id="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar__head">
          <span class="sidebar__title">表</span>
          <button id="new-table-btn" type="button" class="sidebar__new-btn" disabled>+ 新建表</button>
        </div>
        <ul id="table-list" class="table-list"></ul>
      </aside>
      <div id="main">
        <!--
          Phase-A toolbar. The host owns the table flow:
          - "连接 Directus" posts database.openRequested; the host resolves the
            configured source and replies with database.opened (collections).
          - Table switching now happens via the sidebar (#table-list); the
            old #table-select dropdown has been removed.
          - Row-count + status line surface the load progress.
          - Refresh re-selects the current table (re-issues table.selected).
          The grid mount point is below; loading/error overlays cover it during
          fetches and failures.
        -->
        <div id="toolbar" class="toolbar">
          <button id="open-database" type="button" disabled>连接 Directus</button>
          <button id="refresh" type="button" disabled>刷新</button>
          <span id="row-count" class="row-count" aria-live="polite"></span>
        </div>
        <div id="status" class="status">Loading…</div>
        <div id="grid-wrapper" class="grid-wrapper">
          <div id="loading-overlay" class="overlay overlay--loading" hidden>
            <span>加载中…</span>
          </div>
          <div id="error-overlay" class="overlay overlay--error" hidden>
            <span id="error-message"></span>
          </div>
          <div id="grid"></div>
        </div>
      </div>
      <!-- Create-table modal -->
      <div id="create-table-modal" class="modal" hidden>
        <div class="modal__panel">
          <div class="modal__head">
            <h2 class="modal__title">新建表</h2>
            <button id="create-table-close" type="button" class="modal__close" aria-label="关闭">×</button>
          </div>
          <div class="modal__body">
            <label class="field">
              <span class="field__label">表名</span>
              <input id="create-table-name" type="text" class="field__input" maxlength="64" />
            </label>
            <div id="create-table-fields" class="field-rows"></div>
            <button id="create-table-add-field" type="button" class="field__add">+ 添加字段</button>
            <div id="create-table-error" class="modal__error" hidden></div>
          </div>
          <div class="modal__actions">
            <button id="create-table-cancel" type="button" class="btn btn--secondary">取消</button>
            <button id="create-table-submit" type="button" class="btn btn--primary" disabled>创建</button>
          </div>
        </div>
      </div>
      <!-- Delete-confirm modal -->
      <div id="delete-confirm-modal" class="modal" hidden>
        <div class="modal__panel">
          <div class="modal__body">
            <p id="delete-confirm-text" class="modal__text"></p>
          </div>
          <div class="modal__actions">
            <button id="delete-confirm-cancel" type="button" class="btn btn--secondary">取消</button>
            <button id="delete-confirm-ok" type="button" class="btn btn--danger">删除</button>
          </div>
        </div>
      </div>
      <!--
        B2 paste panel (Task 4). Hidden by default; shown when the user pastes
        (Ctrl+V) over a selection. The panel surfaces the transparent preview
        (counts + per-row diagnostics), requires acknowledgement of warnings,
        blocks submission on errors, and shows the server-confirmed result.
      -->
      <div id="paste-panel" class="paste-panel" hidden>
        <div class="paste-panel__header">
          <h2 id="paste-title" class="paste-panel__title">粘贴预览</h2>
          <button id="paste-close" type="button" class="paste-panel__close" aria-label="关闭">×</button>
        </div>
        <div id="paste-summary" class="paste-panel__summary"></div>
        <div id="paste-diagnostics" class="paste-panel__diagnostics"></div>
        <div id="paste-overflow" class="paste-panel__overflow" hidden>
          剪贴板超过 10,000 单元格上限。请改用「文件导入」（C1）。
        </div>
        <div class="paste-panel__actions">
          <label id="paste-ack-wrap" class="paste-panel__ack" hidden>
            <input id="paste-ack" type="checkbox" />
            <span>我已确认上述警告</span>
          </label>
          <button id="paste-confirm" type="button" class="paste-panel__confirm" disabled>提交</button>
          <button id="paste-cancel" type="button" class="paste-panel__cancel">取消</button>
        </div>
      </div>
    </div>
    <!-- Bundled by Vite from src/main.ts (no CDN, no inline scripts). -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
