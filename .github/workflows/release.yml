name: Release

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "30 15 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump for this release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    name: Check whether a release is needed
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      bump: ${{ steps.gate.outputs.bump }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - name: Detect unreleased main commits
        id: gate
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          $shouldRelease = $true
          $bump = "patch"
          $reason = "tag push"

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $bump = $env:MANUAL_BUMP
            if ($bump -notin @("patch", "minor", "major")) {
              throw "Unsupported version bump: $bump"
            }
            $reason = "manual $bump release"
          } elseif ($env:EVENT_NAME -eq "schedule") {
            $latestTag = git tag --merged HEAD --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname |
              Select-Object -First 1
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect release tags"
            }
            if ($latestTag) {
              $commitCount = [int](git rev-list --count "$latestTag..HEAD")
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to inspect commits after $latestTag"
              }
              $shouldRelease = $commitCount -gt 0
              $reason = if ($shouldRelease) {
                "$commitCount commit(s) after $latestTag"
              } else {
                "main is already released as $latestTag"
              }
            } else {
              $reason = "no existing semantic release tag"
            }
          }

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "bump=$bump" >> $env:GITHUB_OUTPUT
          "### Release gate`n`n$reason" >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: Build and publish Windows package
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web-grid/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install pinned Windows race toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "w64devkit-x64-2.8.0.7z.exe"
          $destination = Join-Path $PWD ".tools\w64devkit"
          $expected = "6252bf34fe2231a55ac7f03d482b36d2c7c58697990551bba508102cfb3f342e"
          Invoke-WebRequest `
            -Uri "https://github.com/skeeto/w64devkit/releases/download/v2.8.0/w64devkit-x64-2.8.0.7z.exe" `
            -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "w64devkit checksum mismatch: expected $expected, got $actual"
          }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          7z x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$destination\w64devkit\bin\gcc.exe")) {
            throw "w64devkit extraction did not produce the pinned gcc.exe"
          }

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked build and verification dependencies
        run: uv sync --frozen --group build --group dev

      - name: Install locked web dependencies
        working-directory: desktop/web-grid
        run: npm ci

      - name: Prepare release identity
        id: identity
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_BUMP: ${{ needs.prepare.outputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagAlreadyExists = $false
          if ($env:EVENT_NAME -eq "push") {
            uv run python scripts/release.py --check
            uv run python scripts/changelog.py --check
            $version = (uv run python scripts/release.py --current).Trim()
            $tag = $env:REF_NAME
            if ($tag -ne "v$version") {
              throw "Tag $tag does not match repository version v$version"
            }
          } else {
            uv run python scripts/release.py --check
            $version = (uv run python scripts/release.py --current).Trim()
            $tag = "v$version"

            if (git rev-parse --verify --quiet "refs/tags/$tag") {
              $tagCommit = (git rev-list -n 1 $tag).Trim()
              $headCommit = (git rev-parse HEAD).Trim()
              gh release view $tag *> $null
              $releaseExists = $LASTEXITCODE -eq 0
              if ($tagCommit -eq $headCommit -and -not $releaseExists) {
                $tagAlreadyExists = $true
                Write-Host "Retrying unpublished release $tag without another version bump."
              } else {
                $bump = $env:RELEASE_BUMP
                if ($bump -notin @("patch", "minor", "major")) {
                  throw "Unsupported version bump: $bump"
                }
                uv run python scripts/release.py "--$bump"
                $version = (uv run python scripts/release.py --current).Trim()
                $tag = "v$version"
                if (git rev-parse --verify --quiet "refs/tags/$tag") {
                  throw "Release tag $tag already exists"
                }
              }
            } else {
              Write-Host "Version $version has no tag yet; publishing it without an extra bump."
            }

            if ($tagAlreadyExists) {
              uv run python scripts/changelog.py --check
            } else {
              uv run python scripts/changelog.py --write
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add `
                backend/_version.py `
                desktop/publish-layout.json `
                desktop/web-grid/src/generated/changelog.json `
                CHANGELOG.md
              git diff --cached --quiet
              if ($LASTEXITCODE -ne 0) {
                git commit -m "chore: release $tag"
              }
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tag_exists=$($tagAlreadyExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "### Release identity`n`n$tag" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify Python, contracts, and release tooling
        run: >
          uv run pytest
          tests/backend
          tests/contract
          tests/test_release_tooling.py
          tests/test_architecture.py
          tests/test_handoff_artifacts.py
          -q -o addopts=

      - name: Verify web grid
        working-directory: desktop/web-grid
        run: npm run test

      - name: Build immutable release candidate
        run: uv run python scripts/build_next.py --release

      - name: Archive immutable release candidate
        run: >
          uv run python qa/release_candidate.py create
          --package-root dist/VibeTable.Next
          --archive dist/VibeTable.Next.zip

      - name: Run complete release eligibility gate
        env:
          VIBETABLE_PROVIDER_EVIDENCE_HMAC_KEY: ${{ secrets.PROVIDER_EVIDENCE_HMAC_KEY }}
          VIBETABLE_PROVIDER_EVIDENCE_KEY_ID: ${{ vars.PROVIDER_EVIDENCE_KEY_ID }}
          VIBETABLE_TEST_WINDOWS_CREDENTIAL_MANAGER: "1"
        run: >
          uv run python qa/next.py --ci
          --package-root dist/VibeTable.Next
          --package-archive dist/VibeTable.Next.zip
          --json-report build/qa/release-eligibility.json

      - name: Verify eligibility is bound to the immutable candidate
        run: >
          uv run python qa/release_candidate.py verify
          --package-root dist/VibeTable.Next
          --archive dist/VibeTable.Next.zip
          --eligibility-report build/qa/release-eligibility.json

      - name: Upload release eligibility evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-eligibility-${{ steps.identity.outputs.tag }}
          path: build/qa/release-eligibility.json
          if-no-files-found: error

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: VibeTable-${{ steps.identity.outputs.tag }}
          path: |
            dist/VibeTable.Next.zip
            dist/VibeTable.Next.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish version commit and tag
        if: github.event_name != 'push' && steps.identity.outputs.tag_exists != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          git tag -a $tag -m "VibeTable $tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if (gh release view $tag 2>$null) {
            gh release edit $tag --notes-file CHANGELOG.md --title "VibeTable $tag"
            gh release upload $tag dist/VibeTable.Next.zip dist/VibeTable.Next.zip.sha256 --clobber
          } else {
            gh release create $tag dist/VibeTable.Next.zip dist/VibeTable.Next.zip.sha256 --verify-tag --notes-file CHANGELOG.md --title "VibeTable $tag"
          }
