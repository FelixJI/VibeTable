name: Build Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release tag, for example v0.2.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.repository }}-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    name: Build and upload Windows package
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web-grid/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify tag and draft Release
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (python -c "from backend._version import __version__; print(__version__)").Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match repository version v$version"
          }
          $isDraft = (gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft').Trim()
          if ($isDraft -ne "true") {
            throw "Release $env:RELEASE_TAG must exist and remain a draft before assets are uploaded"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install pinned Windows race toolchain
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "w64devkit-x64-2.8.0.7z.exe"
          $destination = Join-Path $PWD ".tools\w64devkit"
          $expected = "6252bf34fe2231a55ac7f03d482b36d2c7c58697990551bba508102cfb3f342e"
          Invoke-WebRequest `
            -Uri "https://github.com/skeeto/w64devkit/releases/download/v2.8.0/w64devkit-x64-2.8.0.7z.exe" `
            -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "w64devkit checksum mismatch: expected $expected, got $actual"
          }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          7z x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$destination\w64devkit\bin\gcc.exe")) {
            throw "w64devkit extraction did not produce the pinned gcc.exe"
          }

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked build and verification dependencies
        run: uv sync --frozen --group build --group dev

      - name: Install locked web dependencies
        working-directory: desktop/web-grid
        run: npm ci

      - name: Build immutable release candidate
        run: uv run python scripts/build_next.py --release

      - name: Archive immutable release candidate
        env:
          PACKAGE_ARCHIVE: dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip
        run: >
          uv run python qa/release_candidate.py create
          --package-root dist/VibeTable.Next
          --archive $env:PACKAGE_ARCHIVE

      - name: Run complete release eligibility gate
        env:
          VIBETABLE_PROVIDER_EVIDENCE_HMAC_KEY: ${{ secrets.PROVIDER_EVIDENCE_HMAC_KEY }}
          VIBETABLE_PROVIDER_EVIDENCE_KEY_ID: ${{ vars.PROVIDER_EVIDENCE_KEY_ID }}
          VIBETABLE_TEST_WINDOWS_CREDENTIAL_MANAGER: "1"
          PACKAGE_ARCHIVE: dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip
        run: >
          uv run python qa/next.py --ci
          --package-root dist/VibeTable.Next
          --package-archive $env:PACKAGE_ARCHIVE
          --json-report build/qa/release-eligibility.json

      - name: Verify eligibility is bound to the immutable candidate
        env:
          PACKAGE_ARCHIVE: dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip
        run: >
          uv run python qa/release_candidate.py verify
          --package-root dist/VibeTable.Next
          --archive $env:PACKAGE_ARCHIVE
          --eligibility-report build/qa/release-eligibility.json

      - name: Upload release eligibility evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-eligibility-${{ inputs.release_tag }}
          path: build/qa/release-eligibility.json
          if-no-files-found: error

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: VibeTable-${{ inputs.release_tag }}
          path: |
            dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip
            dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach assets to draft Release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_ARCHIVE: dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip
        run: |
          gh release upload $env:RELEASE_TAG `
            $env:PACKAGE_ARCHIVE `
            "$env:PACKAGE_ARCHIVE.sha256" `
            --clobber

  cleanup:
    name: Keep recent published Releases
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep the five most recent published Releases
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json databaseId,tagName,isDraft,publishedAt \
            --jq 'map(select(.isDraft == false and .publishedAt != null)) | sort_by(.publishedAt) | reverse | .[5:][] | [.databaseId, .tagName] | @tsv' |
          while IFS=$'\t' read -r release_id tag_name; do
            echo "Deleting old Release ${tag_name}; the git tag is retained."
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done
