name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release tag, for example v0.2.1
        required: true
        type: string
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.repository }}-${{ inputs.release_tag || 'auto' }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: Build immutable Windows package
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG.Trim()
            if ([string]::IsNullOrEmpty($tag)) { throw "workflow_dispatch requires release_tag input" }
          } else {
            $drafts = gh release list --limit 50 --json tagName,isDraft `
              | ConvertFrom-Json | Where-Object { $_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+$' }
            if (-not $drafts) {
              Write-Host "::notice::No actionable draft release; skipping build."
              "release_tag=" >> $env:GITHUB_OUTPUT
              return
            }
            $tag = $drafts[0].tagName
          }
          git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
          git checkout --detach "$tag"
          if ($env:EVENT_NAME -eq 'workflow_run') {
            $tagCommit = (git rev-parse HEAD).Trim()
            if ($tagCommit -ne $env:TRIGGER_SHA) {
              throw "Draft tag $tag resolves to $tagCommit, not triggering main commit $env:TRIGGER_SHA"
            }
          }
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "::notice::Resolved immutable candidate tag $tag"

      - name: Verify tag and draft Release
        id: identity
        if: steps.resolve.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          $version = (python -c "from backend._version import __version__; print(__version__)").Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match repository version v$version"
          }
          $isDraft = (gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft').Trim()
          if ($isDraft -ne "true") {
            throw "Release $env:RELEASE_TAG must remain a draft"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        if: steps.resolve.outputs.release_tag != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web-grid/package-lock.json

      - uses: actions/setup-go@v7
        if: steps.resolve.outputs.release_tag != ''
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - uses: actions/setup-dotnet@v6
        if: steps.resolve.outputs.release_tag != ''
        with:
          global-json-file: global.json

      - name: Set up uv
        if: steps.resolve.outputs.release_tag != ''
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked build dependencies
        if: steps.resolve.outputs.release_tag != ''
        run: uv sync --frozen --group build --group dev

      - name: Install locked web dependencies
        if: steps.resolve.outputs.release_tag != ''
        working-directory: desktop/web-grid
        run: npm ci

      - name: Build immutable release candidate
        if: steps.resolve.outputs.release_tag != ''
        run: uv run python scripts/build_next.py --release

      - name: Archive immutable release candidate
        if: steps.resolve.outputs.release_tag != ''
        env:
          PACKAGE_ARCHIVE: dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip
        run: >
          uv run python qa/release_candidate.py create
          --package-root dist/VibeTable.Next
          --archive $env:PACKAGE_ARCHIVE

      - name: Upload immutable candidate
        if: steps.resolve.outputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/VibeTable.Next
            dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip
            dist/VibeTable-v${{ steps.identity.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 3

  core:
    name: Core release gate
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web-grid/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --frozen --group build --group dev
      - working-directory: desktop/web-grid
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Run core release eligibility lane
        env:
          VIBETABLE_TEST_WINDOWS_CREDENTIAL_MANAGER: "1"
          PACKAGE_ARCHIVE: dist/VibeTable-v${{ needs.build.outputs.version }}-win-x64.zip
        run: >
          uv run python qa/next.py --lane core
          --package-root dist/VibeTable.Next
          --package-archive $env:PACKAGE_ARCHIVE
          --json-report build/qa/lane-core.json
      - name: Upload core lane evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-lane-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qa/lane-core.json
          if-no-files-found: error
          retention-days: 30

  race:
    name: Go race release gate
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --frozen --group build --group dev
      - name: Install pinned Windows race toolchain
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "w64devkit-x64-2.8.0.7z.exe"
          $destination = Join-Path $PWD ".tools\w64devkit"
          $expected = "6252bf34fe2231a55ac7f03d482b36d2c7c58697990551bba508102cfb3f342e"
          Invoke-WebRequest -Uri "https://github.com/skeeto/w64devkit/releases/download/v2.8.0/w64devkit-x64-2.8.0.7z.exe" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "w64devkit checksum mismatch" }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          7z x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$destination\w64devkit\bin\gcc.exe")) {
            throw "w64devkit extraction did not produce the pinned gcc.exe"
          }
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Run race release eligibility lane
        env:
          VIBETABLE_TEST_WINDOWS_CREDENTIAL_MANAGER: "1"
          PACKAGE_ARCHIVE: dist/VibeTable-v${{ needs.build.outputs.version }}-win-x64.zip
        run: >
          uv run python qa/next.py --lane race
          --package-root dist/VibeTable.Next
          --package-archive $env:PACKAGE_ARCHIVE
          --json-report build/qa/lane-race.json
      - name: Upload race lane evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-lane-race-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qa/lane-race.json
          if-no-files-found: error
          retention-days: 30

  resilience:
    name: Resilience and product E2E gate
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --frozen --group build --group dev
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Run resilience release eligibility lane
        env:
          PACKAGE_ARCHIVE: dist/VibeTable-v${{ needs.build.outputs.version }}-win-x64.zip
        run: >
          uv run python qa/next.py --lane resilience
          --package-root dist/VibeTable.Next
          --package-archive $env:PACKAGE_ARCHIVE
          --json-report build/qa/lane-resilience.json
      - name: Upload resilience lane evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-lane-resilience-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qa/lane-resilience.json
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Require every parallel lane
    needs: [build, core, race, resilience]
    if: always() && needs.build.outputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject failed or skipped release lanes
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CORE_RESULT: ${{ needs.core.result }}
          RACE_RESULT: ${{ needs.race.result }}
          RESILIENCE_RESULT: ${{ needs.resilience.result }}
        run: |
          $results = @($env:BUILD_RESULT, $env:CORE_RESULT, $env:RACE_RESULT, $env:RESILIENCE_RESULT)
          if (@($results | Where-Object { $_ -ne 'success' }).Count -gt 0) {
            throw "Release lanes did not all succeed: $($results -join ', ')"
          }

  release:
    name: Aggregate evidence and publish
    needs: [build, gate]
    if: needs.gate.result == 'success' && needs.build.outputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      PACKAGE_ARCHIVE: dist/VibeTable-v${{ needs.build.outputs.version }}-win-x64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.release_tag }}
          fetch-depth: 0
      - name: Revalidate immutable tag and draft Release
        run: |
          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG" --force
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($tagCommit -ne '${{ needs.build.outputs.commit }}') {
            throw "Release tag moved after the candidate was built"
          }
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release $env:RELEASE_TAG must remain a draft" }
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --frozen --group build --group dev
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-lane-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qa/lanes/core
      - uses: actions/download-artifact@v8
        with:
          name: release-lane-race-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qa/lanes/race
      - uses: actions/download-artifact@v8
        with:
          name: release-lane-resilience-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qa/lanes/resilience
      - name: Run protected package eligibility lane
        env:
          VIBETABLE_PROVIDER_EVIDENCE_HMAC_KEY: ${{ secrets.PROVIDER_EVIDENCE_HMAC_KEY }}
          VIBETABLE_PROVIDER_EVIDENCE_KEY_ID: ${{ vars.PROVIDER_EVIDENCE_KEY_ID }}
        run: >
          uv run python qa/next.py --lane release
          --package-root dist/VibeTable.Next
          --package-archive $env:PACKAGE_ARCHIVE
          --json-report build/qa/lanes/release/lane-release.json
      - name: Aggregate immutable candidate evidence
        run: >
          uv run python qa/release_eligibility.py
          --reports-dir build/qa/lanes
          --package-root dist/VibeTable.Next
          --package-archive $env:PACKAGE_ARCHIVE
          --json-report build/qa/release-eligibility.json
          --github-summary $env:GITHUB_STEP_SUMMARY
      - name: Verify eligibility is bound to the immutable candidate
        run: >
          uv run python qa/release_candidate.py verify
          --package-root dist/VibeTable.Next
          --archive $env:PACKAGE_ARCHIVE
          --eligibility-report build/qa/release-eligibility.json
      - name: Upload release eligibility evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-eligibility-${{ needs.build.outputs.release_tag }}
          path: build/qa/release-eligibility.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: VibeTable-${{ needs.build.outputs.release_tag }}
          path: |
            dist/VibeTable-v${{ needs.build.outputs.version }}-win-x64.zip
            dist/VibeTable-v${{ needs.build.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Attach assets to draft Release
        run: |
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release was published before assets were ready" }
          gh release upload $env:RELEASE_TAG $env:PACKAGE_ARCHIVE "$env:PACKAGE_ARCHIVE.sha256" --clobber
      - name: Verify attached Release assets
        env:
          PACKAGE_ARCHIVE_NAME: VibeTable-v${{ needs.build.outputs.version }}-win-x64.zip
        run: |
          $release = gh release view $env:RELEASE_TAG --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release was published before asset verification" }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $expected = @($env:PACKAGE_ARCHIVE_NAME, "$($env:PACKAGE_ARCHIVE_NAME).sha256")
          $missing = @($expected | Where-Object { $_ -notin $assetNames })
          if ($missing.Count -gt 0) { throw "Missing Release assets: $($missing -join ', ')" }
      - name: Publish verified Release
        if: github.event_name == 'workflow_run'
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          $release = gh release view $env:RELEASE_TAG --json isDraft,publishedAt | ConvertFrom-Json
          if ($release.isDraft -or [string]::IsNullOrEmpty($release.publishedAt)) {
            throw "Release $env:RELEASE_TAG was not published"
          }
