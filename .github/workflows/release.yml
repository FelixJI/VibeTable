name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    name: Build and publish Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/web-grid/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install locked build and verification dependencies
        run: uv sync --frozen --group build --group dev

      - name: Install locked web dependencies
        working-directory: desktop/web-grid
        run: npm ci

      - name: Validate tag and release identity
        shell: pwsh
        run: |
          uv run python scripts/release.py --check
          $version = (uv run python scripts/release.py --current).Trim()
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match repository version v$version"
          }

      - name: Verify Python, contracts, and release tooling
        run: >
          uv run pytest
          tests/backend
          tests/contract
          tests/test_release_tooling.py
          tests/test_architecture.py
          tests/test_handoff_artifacts.py
          -q -o addopts=

      - name: Verify web grid
        working-directory: desktop/web-grid
        run: npm run test

      - name: Verify sidecar
        run: uv run python qa/next.py --stage go-test

      - name: Verify .NET release configuration
        run: dotnet test desktop/VibeTable.Desktop.sln --configuration Release

      - name: Build release package
        run: uv run python scripts/build_next.py --release

      - name: Verify package
        run: uv run python qa/package_check.py dist/VibeTable.Next

      - name: Archive and checksum
        shell: pwsh
        run: |
          if (!(Test-Path dist/VibeTable.Next)) {
            throw "Build artifact missing: dist/VibeTable.Next"
          }
          Compress-Archive -Path dist/VibeTable.Next/* -DestinationPath dist/VibeTable.Next.zip -Force
          $hash = (Get-FileHash dist/VibeTable.Next.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VibeTable.Next.zip" | Set-Content -Encoding ascii dist/VibeTable.Next.zip.sha256

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: VibeTable-${{ github.ref_name }}
          path: |
            dist/VibeTable.Next.zip
            dist/VibeTable.Next.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag dist/VibeTable.Next.zip dist/VibeTable.Next.zip.sha256 --clobber
          } else {
            gh release create $tag dist/VibeTable.Next.zip dist/VibeTable.Next.zip.sha256 --verify-tag --generate-notes --title "VibeTable $tag"
          }
