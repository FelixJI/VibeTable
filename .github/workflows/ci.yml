name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: CodeQL (${{ matrix.language }})
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: autobuild
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: linked
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  plan:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: windows-latest
    outputs:
      sharded: ${{ steps.plan.outputs.sharded }}
      matrix: ${{ steps.plan.outputs.matrix }}
      handoff-paths: ${{ steps.plan.outputs.handoff_paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Plan repository gates
        id: plan
        run: >-
          python scripts/automation.py ci
          --phase plan
          --event '${{ github.event_name }}'
          --source-sha '${{ github.sha }}'

  prepare:
    needs: plan
    if: needs.plan.outputs.sharded == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('**/package-lock.json') != ''
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: hashFiles('sidecar/go.mod') != ''
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Build immutable candidate after pre-release gates
        env:
          GH_TOKEN: ${{ github.token }}
          VIBETABLE_CI_PREPARE_MODE: candidate
        run: >-
          python scripts/automation.py ci
          --phase prepare
          --event '${{ github.event_name }}'
          --source-sha '${{ github.sha }}'
      - name: Upload failed prepare evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-prepare-evidence
          path: |
            build/qa/pr-product-e2e
            build/qa/workbench-qualification-pr.json
          if-no-files-found: warn
          retention-days: 3
      - name: Upload failed updater evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-updater-evidence
          path: |
            build/self-update-smoke/**/.VibeTable.Next.update-pending.json
            build/self-update-smoke/**/.VibeTable.Next.update-rollback-*.json
            build/self-update-smoke/**/*.activation-error.txt
            build/self-update-smoke/**/vibetable-readiness.json
            build/self-update-smoke/**/vibetable-trace.log
            build/self-update-smoke/**/host-lifecycle-state.json
            build/self-update-smoke/**/.self-update-smoke-process.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - name: Upload immutable candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-candidate-handoff
          path: ${{ needs.plan.outputs.handoff-paths }}
          if-no-files-found: error
          retention-days: 1

  shard:
    permissions:
      contents: read
      actions: read
    needs: [plan, prepare]
    if: needs.plan.outputs.sharded == 'true' && needs.prepare.result == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.uv == true
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.dotnet == true && hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.node == true && hashFiles('**/package-lock.json') != ''
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go == true && hashFiles('sidecar/go.mod') != ''
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Restore w64devkit cache
        if: startsWith(matrix.name, 'race-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/w64devkit
          key: w64devkit-${{ runner.os }}-${{ hashFiles('scripts/automation_project.py', 'scripts/toolchain_metadata.py') }}
      - name: Download immutable candidate handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name ci-candidate-handoff --dir .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify immutable candidate lane
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHARD_LANE: ${{ matrix.name }}
        run: >-
          python scripts/automation.py ci
          --phase shard
          --lane $env:CI_SHARD_LANE
          --event '${{ github.event_name }}'
          --source-sha '${{ github.sha }}'
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lane-${{ matrix.name }}
          path: |
            build/automation/lane-reports/${{ matrix.name }}.json
            build/automation/lane-evidence/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 3

  required:
    permissions:
      contents: read
      actions: read
    needs: [plan, prepare, shard]
    if: always() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    name: required
    runs-on: windows-latest
    steps:
      - name: Fail closed on orchestration errors
        env:
          CI_SHARDED: ${{ needs.plan.outputs.sharded }}
          CI_PLAN_RESULT: ${{ needs.plan.result }}
          CI_PREPARE_RESULT: ${{ needs.prepare.result }}
          CI_SHARD_RESULT: ${{ needs.shard.result }}
        shell: pwsh
        run: |
          if ($env:CI_PLAN_RESULT -ne 'success') { exit 1 }
          if ($env:CI_SHARDED -eq 'true') {
            if ($env:CI_PREPARE_RESULT -ne 'success' -or $env:CI_SHARD_RESULT -ne 'success') { exit 1 }
          } elseif ($env:CI_SHARDED -eq 'false') {
            if ($env:CI_PREPARE_RESULT -ne 'skipped' -or $env:CI_SHARD_RESULT -ne 'skipped') { exit 1 }
          } else {
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.plan.outputs.sharded != 'true'
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.plan.outputs.sharded != 'true' && hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.plan.outputs.sharded != 'true' && hashFiles('**/package-lock.json') != ''
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.plan.outputs.sharded != 'true' && hashFiles('sidecar/go.mod') != ''
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Download immutable candidate handoff
        if: needs.plan.outputs.sharded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name ci-candidate-handoff --dir .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download lane evidence
        if: needs.plan.outputs.sharded == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-lane-*
          path: build/automation
          merge-multiple: true
      - name: Verify repository
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHARDED: ${{ needs.plan.outputs.sharded }}
        shell: pwsh
        run: |
          if ($env:CI_SHARDED -eq 'true') {
            python scripts/automation.py ci `
              --phase finalize `
              --reports-dir 'build/automation/lane-reports' `
              --event '${{ github.event_name }}' `
              --source-sha '${{ github.sha }}'
          } else {
            python scripts/automation.py ci `
              --event '${{ github.event_name }}' `
              --source-sha '${{ github.sha }}'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload main release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: build/automation/release-candidate
          if-no-files-found: error
          retention-days: 14
