name: CD

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump in the Release PR
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create or refresh release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python scripts/automation.py release prepare --bump '${{ inputs.bump }}'

  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Download exact CI candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: build/automation/release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Stage release
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/automation.py release stage
          --candidate-dir build/automation/release-candidate
          --source-sha '${{ github.event.workflow_run.head_sha }}'
      - name: Verify closed product E2E evidence
        if: steps.stage.outputs.publish == 'true'
        run: uv run --frozen python scripts/automation_project.py release-evidence
      - name: Attest release provenance
        if: steps.stage.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.stage.outputs.checksums }}
      - name: Attest release SBOM
        if: steps.stage.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.stage.outputs.checksums }}
          sbom-path: ${{ steps.stage.outputs.sbom }}
      - name: Publish and reconcile release
        if: steps.stage.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_URL: ${{ secrets.GITEE_URL }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CNB_URL: ${{ secrets.CNB_URL }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: >-
          python scripts/automation.py release publish
          --candidate-dir build/automation/release-candidate
          --source-sha '${{ github.event.workflow_run.head_sha }}'
