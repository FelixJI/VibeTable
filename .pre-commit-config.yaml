repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: python qa/precommit.py ruff-format
        language: system
        types: [python]
        exclude: ^(?:runtime/node/node_modules/|scripts/automation_core\.py$)
        pass_filenames: true

      - id: ruff-check
        name: ruff-check
        entry: python qa/precommit.py ruff-check
        language: system
        types: [python]
        exclude: ^runtime/node/node_modules/
        pass_filenames: true

      - id: version-consistency
        name: version-consistency
        entry: python qa/precommit.py version-consistency
        language: system
        pass_filenames: false
        always_run: true

      - id: package-contract
        name: package-contract
        entry: python qa/precommit.py package-contract
        language: system
        pass_filenames: false
        always_run: true
